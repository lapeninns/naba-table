x-nabatable-service: &nabatable-service
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile
  working_dir: /workspace
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    - pnpm_store:/workspace/.pnpm-store
    - pnpm_store:/home/node/.local/share/pnpm/store
  init: true

services:
  install:
    <<: *nabatable-service
    command: bash -lc "corepack enable && pnpm install --frozen-lockfile"

  web:
    <<: *nabatable-service
    shm_size: 1gb
    extra_hosts:
      - 'app.localhost:127.0.0.1'
    depends_on:
      install:
        condition: service_completed_successfully
    command: pnpm dev
    environment:
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      QA_TARGET_ENV: local-container
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  booking-short-links:
    <<: *nabatable-service
    depends_on:
      install:
        condition: service_completed_successfully
    command: pnpm --filter @nabatable/booking-short-links dev -- --ip 0.0.0.0 --port 8787
    ports:
      - '8787:8787'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  email-queue-gateway:
    <<: *nabatable-service
    depends_on:
      install:
        condition: service_completed_successfully
    command: pnpm --filter @nabatable/email-queue-gateway dev -- --ip 0.0.0.0 --port 8788
    ports:
      - '8788:8788'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  sms-summary-gateway:
    <<: *nabatable-service
    depends_on:
      install:
        condition: service_completed_successfully
    command: pnpm --filter @nabatable/sms-summary-gateway dev -- --ip 0.0.0.0 --port 8789
    ports:
      - '8789:8789'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8789/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  node_modules:
  pnpm_store:

# tinyproxy configuration for the nabatable-ci guest.
# Installed to /etc/tinyproxy/tinyproxy.conf by network/setup.sh.
# Requires tinyproxy >= 1.11 (FilterType, multiple Listen directives).
User tinyproxy
Group tinyproxy

Port 8888
# Job-facing (gateway of the internal job network nabatable-ci-jobs) and
# guest-local (dockerd and apt). Image builds use the job-facing proxy.
Listen 10.90.0.1
Listen 127.0.0.1

Timeout 300
MaxClients 64
LogLevel Warning
Syslog On

# Never forward to another proxy; never advertise ourselves.
DisableViaHeader Yes
ViaProxyName "nabatable-ci"

# Only the job subnet and the guest itself may use the proxy.
Allow 127.0.0.1
Allow 10.90.0.0/24

# CONNECT is restricted to TLS; plain HTTP is used only by apt mirrors.
ConnectPort 443

# Hostname allowlist, default deny, no URL-path matching.
Filter "/etc/tinyproxy/allowlist.txt"
FilterType fnmatch
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive No

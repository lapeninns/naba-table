openapi: 3.1.0
info:
  title: Nabatable SMS summary gateway API
  version: 1.0.0
  description: Daily manager summary dispatch gateway.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Gateway is healthy.
  /internal/dispatch-daily-summary:
    post:
      operationId: dispatchDailySummary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [restaurantId]
              properties:
                restaurantId:
                  type: string
                  format: uuid
                localDate:
                  type: string
                  format: date
                dryRun:
                  type: boolean
                force:
                  type: boolean
      responses:
        '202':
          description: Summary queued.
        '400':
          description: Invalid request.
        '401':
          description: Invalid service token.
        '404':
          description: Restaurant summary target not found.
  /webhook/twilio/manager-whatsapp-status:
    post:
      operationId: reconcileManagerWhatsAppStatus
      description: Receives correlated Twilio delivery callbacks, verifies the current message status through the Twilio API, and sends an SMS fallback for terminal WhatsApp failures.
      parameters:
        - in: query
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: localDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: callbackToken
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MessageSid, MessageStatus, To]
              properties:
                ErrorCode:
                  type: string
                MessageSid:
                  type: string
                MessageStatus:
                  type: string
                To:
                  type: string
      responses:
        '200':
          description: Callback reconciled or safely ignored.
        '400':
          description: Invalid callback payload or correlation.
        '503':
          description: Provider verification or fallback is retryable, or reconciliation is required.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

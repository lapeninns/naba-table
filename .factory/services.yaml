commands:
  install: pnpm install
  dev: PORT=3000 pnpm dev
  build: pnpm build
  typecheck: pnpm typecheck
  lint: npx eslint "src/components/features/seating/**/*.{ts,tsx}" "src/app/app/(app)/floor-plan/page.tsx" "src/app/app/(app)/seating/page.tsx" "src/app/app/(app)/seating/floor-plan/page.tsx" "src/app/(public)/dev/ops-floor-plan/**/*.{ts,tsx}" "tests/ops/useFloorPlanTables.test.tsx" "tests/components/floor-plan/**/*.{ts,tsx}"
  test: npx vitest run tests/ops/useFloorPlanTables.test.tsx tests/components/floor-plan --passWithNoTests --maxWorkers=9

services:
  web:
    start: PORT=3000 pnpm dev
    stop: lsof -ti :3000 | xargs kill
    healthcheck: curl -sf http://localhost:3000/auth/signin > /dev/null
    port: 3000
    depends_on: []

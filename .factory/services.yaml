commands:
  install: pnpm install
  dev: pnpm dev
  build: pnpm build
  typecheck: pnpm typecheck
  lint: pnpm lint
  test: npx vitest run --maxWorkers=9
  test:e2e:guest: npx playwright test tests/e2e/guest-public-marketing.spec.ts tests/e2e/guest-public-pages.spec.ts tests/e2e/guest-auth-pages.spec.ts tests/e2e/guest-booking.spec.ts tests/e2e/guest-booking-manage.spec.ts tests/e2e/guest-receipt-pages.spec.ts tests/e2e/guest-portal-redirects.spec.ts tests/e2e/guest-reserve-routes.spec.ts tests/e2e/guest-mocked-api-coverage.spec.ts --workers=6

services:
  web:
    start: pnpm dev
    stop: lsof -ti :3000 | xargs kill
    healthcheck: curl -sf http://localhost:3000
    port: 3000
    depends_on: []

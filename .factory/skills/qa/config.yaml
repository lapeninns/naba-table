project: nabatable-platform
imagemagick: true
environments:
  development:
    url: 'http://localhost:3000'
    restrictions:
      - 'Use non-production credentials and local dev servers only.'
      - 'Ops routes run on app host semantics; derive ops URLs from app.localhost when subdomain testing is required.'
  preview:
    url: '${VERCEL_PREVIEW_URL}'
    restrictions:
      - 'Treat preview URLs as development-like environments that use dev/staging flows and sandbox credentials.'
      - 'Do not use production-only data, voucher codes, or payment assumptions against preview URLs.'
  staging:
    url: '${NEXT_PUBLIC_SITE_URL}'
    restrictions:
      - 'Use shared staging data only.'
      - 'Do not create irreversible production data.'
  production:
    url: 'https://www.nabatable.com'
    restrictions:
      - 'Never create disposable users or destructive test data in production.'
      - 'Prefer read-only verification unless the operator explicitly authorizes more.'

default_target: development

auth:
  method: email-password
  secondary_methods:
    - magic-link
  provider: Supabase
  notes:
    - 'Guest auth primarily uses magic-link flows on /auth/signin.'
    - 'Ops auth uses the app-host sign-in page and requires a valid restaurant membership.'

personas:
  - name: guest
    description: 'Authenticated guest account used to manage bookings, profile details, and receipts.'
    email: '<provide-guest-test-email>'
    credentials_source: manual
    test_focus:
      - guest auth
      - booking management
      - guest dashboard
      - profile updates
    cannot_do:
      - access ops routes on the app host
      - edit restaurant settings
  - name: ops_owner
    description: 'Restaurant owner account with bookings, dashboard, customer, settings, and team access.'
    email: '<provide-ops-owner-test-email>'
    credentials_source: manual
    test_focus:
      - ops auth
      - dashboard and bookings
      - customers
      - restaurant settings
      - team management
      - Google Business Profile flows
    cannot_do:
      - access restaurants without a membership
      - bypass password confirmation flows when required
  - name: new_user
    description: 'Fresh signup, no existing data'
    email_pattern: 'qa+signup_{RUN_ID}@example.test'
    credentials_source: manual
    test_focus:
      - onboarding
      - empty states
      - first-run experience

apps:
  web:
    path_patterns:
      - 'src/app/(public)/**'
      - 'src/app/guest/**'
      - 'src/app/app/**'
      - 'src/components/**'
      - 'components/**'
      - 'hooks/**'
      - 'src/hooks/**'
      - 'src/contexts/**'
      - 'src/guest/**'
      - 'src/services/**'
      - 'src/proxy.ts'
      - 'src/app/layout.tsx'
      - 'src/app/providers.tsx'
      - 'next.config.js'
      - 'tailwind.config.js'
      - 'lib/**'
    skill: qa-web
    test_tool: agent-browser
    build_command: 'pnpm dev'
    local_base_urls:
      guest: 'http://localhost:3000'
      ops: 'http://app.localhost:3000'
  backend:
    path_patterns:
      - 'src/app/api/**'
      - 'server/**'
      - 'libs/**'
      - 'config/**'
      - 'scripts/**'
      - 'openapi.yaml'
      - 'vercel.json'
      - 'lib/**'
    skill: qa-backend
    test_tool: curl
    build_command: 'pnpm dev'
    local_base_url: 'http://localhost:3000'
  reserve:
    path_patterns:
      - 'reserve/**'
    skill: qa-reserve
    test_tool: agent-browser
    build_command: 'pnpm reserve:dev -- --host 127.0.0.1 --port 5174'
    local_base_url: 'http://127.0.0.1:5174'
  cloudflare-workers:
    path_patterns:
      - 'cloudflare/**'
    skill: qa-cloudflare-workers
    test_tool: curl
    local_base_urls:
      email_queue_gateway: '${CLOUDFLARE_EMAIL_QUEUE_GATEWAY_URL}'
      booking_short_links: '${BOOKING_SHORT_LINKS_BASE_URL}'

feature_flags:
  provider: custom-env
  dashboard_url: ''
  how_to_override: 'Set FEATURE_* and NEXT_PUBLIC_FEATURE_* environment variables before starting pnpm dev or on the target deployment. Ops feature visibility is also affected by membership-derived flags in app layout/session state.'

integrations:
  email:
    provider: Resend
    mode: sandbox-or-test-where-available
    credentials_source: env-vars
    secret_names:
      - RESEND_API_KEY
      - RESEND_FROM
      - RESEND_WEBHOOK_SECRET
    verification: 'Use manual inbox checks unless a dedicated test mailbox is later supplied.'
  sms:
    provider: Twilio
    mode: sandbox-or-test-where-available
    credentials_source: env-vars
    secret_names:
      - TWILIO_ACCOUNT_SID
      - TWILIO_API_KEY_SID
      - TWILIO_API_KEY_SECRET
      - TWILIO_AUTH_TOKEN
      - TWILIO_MESSAGING_SERVICE_SID
    verification: 'Use manual phone or SMS sink checks unless a dedicated sink is later supplied.'
  business_profile:
    provider: Google Business Profile
    mode: run-only-when-creds-exist
    credentials_source: env-vars
    secret_names:
      - GOOGLE_BUSINESS_PROFILE_CLIENT_ID
      - GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET
      - GOOGLE_BUSINESS_PROFILE_REDIRECT_URI
      - GOOGLE_BUSINESS_PROFILE_TOKEN_ENCRYPTION_KEY
  captcha:
    provider: Cloudflare Turnstile
    credentials_source: env-vars
    secret_names:
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY
      - TURNSTILE_SECRET_KEY
      - TURNSTILE_EXPECTED_HOSTNAME

cleanup:
  auto_cleanup: false
  strategy: manual
  instructions: 'Prefer deleting created records through the ops admin UI or existing API routes when they are clearly available. If cleanup is ambiguous, prefer read-only validation over creating persistent data.'

failure_learning: suggest_in_report

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUSKY: 0
  CI: true
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://example.com' }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_test' }}
  RESEND_FROM: ${{ secrets.RESEND_FROM || 'no-reply@example.com' }}

jobs:
  # ============================================
  # JOB 1: Code Quality
  # ============================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AGENTS.md validation (timed)
        run: |
          start=$(date +%s)
          pnpm agents:validate
          end=$(date +%s)
          echo "- AGENTS.md validation: $((end-start))s" >> $GITHUB_STEP_SUMMARY

      - name: Version drift check (timed)
        run: |
          start=$(date +%s)
          pnpm version:drift
          end=$(date +%s)
          echo "- Version drift check: $((end-start))s" >> $GITHUB_STEP_SUMMARY

      - name: Feature flag audit (timed)
        run: |
          start=$(date +%s)
          pnpm flags:audit
          end=$(date +%s)
          echo "- Feature flag audit: $((end-start))s" >> $GITHUB_STEP_SUMMARY

      - name: Lint (timed)
        run: |
          start=$(date +%s)
          pnpm lint
          end=$(date +%s)
          echo "- Lint: $((end-start))s" >> $GITHUB_STEP_SUMMARY

      - name: Typecheck (timed)
        run: |
          start=$(date +%s)
          pnpm typecheck
          end=$(date +%s)
          echo "- Typecheck: $((end-start))s" >> $GITHUB_STEP_SUMMARY

      - name: Unit Tests (timed)
        run: |
          start=$(date +%s)
          pnpm test:ci
          end=$(date +%s)
          echo "- Unit tests: $((end-start))s" >> $GITHUB_STEP_SUMMARY

      - name: Build (timed)
        run: |
          start=$(date +%s)
          pnpm build
          end=$(date +%s)
          echo "- Build: $((end-start))s" >> $GITHUB_STEP_SUMMARY
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Bundle budget (timed)
        run: |
          start=$(date +%s)
          pnpm bundle:budget
          end=$(date +%s)
          echo "- Bundle budget: $((end-start))s" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 2: E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: 🎭 E2E Tests (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Start application
        run: |
          pnpm start &
          sleep 10
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Application is ready"
              exit 0
            fi
            echo "Waiting for app... (attempt $i/30)"
            sleep 2
          done
          echo "❌ Application failed to start"
          exit 1

      - name: Run E2E Tests
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/2
        env:
          BASE_URL: http://localhost:3000
          E2E_TEST_GUEST_EMAIL: ${{ secrets.E2E_TEST_GUEST_EMAIL }}
          E2E_TEST_RESTAURANT_SLUG: 'white-horse-pub-waterbeach'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB 3: Accessibility Audit (Axe)
  # ============================================
  accessibility:
    name: ♿ Accessibility Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Start application
        run: |
          pnpm start &
          sleep 15
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Run Accessibility Tests
        if: ${{ hashFiles('tests/e2e/accessibility/**/*') != '' }}
        run: pnpm exec playwright test tests/e2e/accessibility --project=chromium
        env:
          BASE_URL: http://localhost:3000

      - name: Skip Accessibility Tests (none found)
        if: ${{ hashFiles('tests/e2e/accessibility/**/*') == '' }}
        run: echo "No accessibility tests found under tests/e2e/accessibility; skipping."

      - name: Upload A11y Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14

  # ============================================
  # JOB 4: Lighthouse CI (Performance)
  # ============================================
  lighthouse:
    name: ⚡ Lighthouse Performance
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

      - name: Comment Lighthouse Results
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = '.lighthouseci/manifest.json';

            if (!fs.existsSync(path)) {
              console.log('No Lighthouse manifest found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const results = manifest.map(run => {
              const summary = run.summary;
              return `| ${run.url} | ${Math.round(summary.performance * 100)} | ${Math.round(summary.accessibility * 100)} | ${Math.round(summary['best-practices'] * 100)} | ${Math.round(summary.seo * 100)} |`;
            }).join('\n');

            const body = `## ⚡ Lighthouse Performance Report

            | URL | Performance | Accessibility | Best Practices | SEO |
            |-----|-------------|---------------|----------------|-----|
            ${results}

            📊 Full report available in workflow artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================
  # JOB 5: Visual Regression
  # ============================================
  visual-regression:
    name: 📸 Visual Regression
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Start application
        run: |
          pnpm start &
          sleep 15
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESERVE_API_BASE_URL: 'https://app.nabatable.com'

      - name: Run Visual Regression Tests
        run: pnpm exec playwright test tests/e2e/visual --project=chromium
        env:
          BASE_URL: http://localhost:3000
        continue-on-error: true # Visual diffs are available as artifacts without blocking CI; update baselines via a manual run with --update-snapshots.

      - name: Upload Visual Diff Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ============================================
  # JOB 6: Security Scans
  # ============================================
  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@v3.92.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          scan: git

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level=high

  # ============================================
  # JOB 7: Database Drift Check
  # ============================================
  db-drift-check:
    name: 🗄️ DB Drift Check
    runs-on: ubuntu-latest
    needs: quality
    env:
      DRIFT_CHECK_DB_URL: ${{ secrets.DRIFT_CHECK_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Check migration drift
        if: ${{ env.DRIFT_CHECK_DB_URL != '' }}
        run: pnpm db:check-drift

      - name: Skip drift check (missing secret)
        if: ${{ env.DRIFT_CHECK_DB_URL == '' }}
        run: echo "Skipping drift check because DRIFT_CHECK_DB_URL is not set."

  # ============================================
  # JOB 8: PR Preview Deploy (Vercel)
  # ============================================
  preview-deploy:
    name: 🔗 PR Preview Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      secrets.VERCEL_TOKEN != '' &&
      secrets.VERCEL_ORG_ID != '' &&
      secrets.VERCEL_PROJECT_ID != ''
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: true
          working-directory: ./

      - name: Comment Preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const previewUrl = '${{ steps.vercel-deploy.outputs.preview-url }}';
            if (previewUrl) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔗 Preview Deployment Ready!
                
                Your changes have been deployed to a preview URL:
                
                **🌐 Preview:** ${previewUrl}
                
                This preview will be updated with each new commit to this PR.
                
                ### Quick Links
                - [Home](${previewUrl})
                - [Sign In](${previewUrl}/auth/signin)
                - [Restaurant](${previewUrl}/restaurants/white-horse-pub-waterbeach)
                `
              });
            }

  # ============================================
  # JOB 9: Test Summary
  # ============================================
  test-summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, accessibility, lighthouse, visual-regression]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check E2E status
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "| 🎭 E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎭 E2E Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check Accessibility status
          if [ "${{ needs.accessibility.result }}" == "success" ]; then
            echo "| ♿ Accessibility | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ♿ Accessibility | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check Lighthouse status
          if [ "${{ needs.lighthouse.result }}" == "success" ]; then
            echo "| ⚡ Performance | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⚡ Performance | ⚠️ Check Report |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check Visual Regression status
          if [ "${{ needs.visual-regression.result }}" == "success" ]; then
            echo "| 📸 Visual Regression | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📸 Visual Regression | ⚠️ Review Changes |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 **Artifacts:** Available for download from the Actions tab" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 10: Deploy Gate
  # ============================================
  deploy-gate:
    name: 🚀 Deploy Gate
    runs-on: ubuntu-latest
    needs: [quality, e2e-tests, accessibility, lighthouse, security, db-drift-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check All Jobs Passed
        run: |
          echo "## ✅ All CI Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following checks have passed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Code Quality**: Lint, Typecheck, Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Build**: Production build succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **E2E Tests**: All functional tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Accessibility**: WCAG 2.1 AA compliance verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Performance**: Lighthouse budgets met" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Security**: No secrets leaked, dependencies clean" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Database**: No schema drift detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Ready for production deployment!**" >> $GITHUB_STEP_SUMMARY

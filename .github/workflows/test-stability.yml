name: Test stability

# Scheduled for removal after Phase 4 evidence: the local CI profile evidences
# this suite and the release gate republishes the "Shuffle seed <seed>" check from it.
# Kept until the transition evidence window closes; do not add new steps here.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
# The pull_request trigger was removed: three full-suite matrix legs per PR is
# the single most expensive item in the old PR lane, and order-dependence is a
# trend to watch nightly, not a per-commit merge gate.

permissions:
  contents: read

jobs:
  repeat:
    name: Shuffle seed ${{ matrix.seed }}
    runs-on: [self-hosted, nabatable]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [20260715, 20260716, 20260717]
    env:
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repeat root tests without retries
        run: pnpm test:stability --sequence.seed=${{ matrix.seed }}
      - name: Repeat Worker tests without retries
        run: pnpm --filter '@nabatable/*' -r test

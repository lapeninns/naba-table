name: Test stability

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - 'vitest.config.ts'
      - 'cloudflare/*/vitest.config.ts'

permissions:
  contents: read

jobs:
  repeat:
    name: Shuffle seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [20260715, 20260716, 20260717]
    env:
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repeat root tests without retries
        run: pnpm test:stability -- --sequence.seed=${{ matrix.seed }}
      - name: Repeat Worker tests without retries
        run: pnpm --filter '@nabatable/*' -r test

name: E2E smoke

# Three unauthenticated browser smoke packs run with local mocks and no real
# credentials or remote targets.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke packs
    runs-on: ubuntu-latest
    # A hung dev server must not burn hours of CI.
    timeout-minutes: 30
    env:
      # Sanitized offline env only — mirrors test-suite.yml plus QA_USE_MOCKS.
      # The Playwright webServer commands override app-facing values with
      # localhost equivalents; nothing here is a real credential.
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      QA_USE_MOCKS: '1'
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the Playwright configs run Chromium projects.
      # Browsers are intentionally not cached: a stale cache versus the pinned
      # @playwright/test version fails confusingly, and correctness beats speed.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Public booking browser smoke
        run: pnpm exec playwright test tests/e2e/guest-booking.spec.ts

      - name: Ops lifecycle browser smoke
        run: pnpm exec playwright test tests/e2e/ops-app-host-redirects.spec.ts

      - name: Guest portal browser smoke
        run: pnpm exec playwright test tests/e2e/guest-portal-redirects.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-smoke-artifacts
          path: test-results/qa/
          if-no-files-found: ignore
          retention-days: 7

name: E2E smoke

# Scheduled for removal after Phase 4 evidence: the local CI profile evidences
# this suite and the release gate republishes the "Browser smoke packs" check from it.
# Kept until the transition evidence window closes; do not add new steps here.

# Three unauthenticated browser smoke packs run with local mocks and no real
# credentials or remote targets.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke packs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Functional smoke only (no pixel comparison), so aarch64 Chromium is fine.
    # Pixel-comparing specs stay hosted - see quality-gates.yml visual-routes.
    runs-on: [self-hosted, nabatable-release]
    # A hung dev server must not burn hours of CI.
    timeout-minutes: 30
    env:
      # Sanitized offline env only — mirrors test-suite.yml plus QA_USE_MOCKS.
      # The Playwright webServer commands override app-facing values with
      # localhost equivalents; nothing here is a real credential.
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      QA_USE_MOCKS: '1'
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the Playwright configs run Chromium projects.
      # Browsers are intentionally not cached: a stale cache versus the pinned
      # @playwright/test version fails confusingly, and correctness beats speed.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Public booking browser smoke
        run: pnpm exec playwright test tests/e2e/guest-booking.spec.ts

      - name: Ops lifecycle browser smoke
        run: pnpm exec playwright test tests/e2e/ops-app-host-redirects.spec.ts

      - name: Guest portal browser smoke
        run: pnpm exec playwright test tests/e2e/guest-portal-redirects.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-smoke-artifacts
          path: test-results/qa/
          if-no-files-found: ignore
          retention-days: 7

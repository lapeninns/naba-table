name: Flaky Test Detection

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  HUSKY: 0
  CI: true

jobs:
  detect-flakes:
    name: 🔁 Re-run tests (flake check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests 5x (no retries)
        run: |
          for i in 1 2 3 4 5; do
            echo "Run $i/5"
            pnpm exec vitest run --coverage --reporter=verbose --retry=0
          done

name: Self-hosted runner qualification
on:
  push:
    branches: [codex/ci-provisioned-identities]
    paths: [.github/workflows/self-hosted-proof.yml]
permissions: {}
jobs:
  proof:
    if: github.repository_id == '1105219228' && github.actor_id == '230744634'
    runs-on: nabatable-proof-${{ github.sha }}
    timeout-minutes: 5
    steps:
      - name: Verify isolated execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(id -u)" != 0
          test ! -e /Users/amankumarshrestha
          ! sudo -n true 2>/dev/null
          ! test -r /var/run/docker.sock
          python3 - <<'PY'
          import socket
          for address in ['192.168.5.2', '10.0.0.1', '169.254.169.254']:
              for port in [80, 443]:
                  try:
                      socket.create_connection((address, port), timeout=2)
                  except OSError:
                      continue
                  raise SystemExit(f'Private network unexpectedly reachable: {address}:{port}')
          print('Private-network probes denied')
          PY
          printf '%s\n' 'Isolated Actions execution passed'

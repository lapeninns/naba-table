name: QA foundation

on:
  pull_request:
    paths:
      - '.github/workflows/qa-foundation.yml'
      - 'config/qa/**'
      - 'docs/qa/**'
      - 'package.json'
      - 'playwright.app.config.ts'
      - 'playwright.config.ts'
      - 'playwright.reserve.config.ts'
      - 'pnpm-lock.yaml'
      - 'scripts/check-luma-compliance.mjs'
      - 'scripts/qa/**'
      - 'tests/qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Sprint 0 foundation
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run QA foundation tests
        run: pnpm run qa:foundation

name: Shadcn primitives

on:
  pull_request:

jobs:
  primitives:
    name: Primitive coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shadcn primitive coverage
        run: pnpm node scripts/check-no-shadcn.mjs --primitives-only

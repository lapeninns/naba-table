name: Shadcn primitives

# Scheduled for removal after Phase 4 evidence: the local CI profile evidences
# this suite and the release gate republishes the "Primitive coverage" check from it.
# Kept until the transition evidence window closes; do not add new steps here.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primitives:
    name: Primitive coverage
    runs-on: [self-hosted, nabatable]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shadcn primitive coverage (baseline ratchet)
        run: pnpm run guard:no-shadcn:ci

      - name: Check for cross-root component shadowing
        run: pnpm run guard:no-shadow-roots

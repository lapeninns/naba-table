name: PR Auto Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post checklist comment
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const hasTask = /tasks\/[a-z0-9-]+-\d{8}-\d{4}/i.test(body);

            const message = [
              '## PR Readiness Checklist',
              '',
              hasTask ? '- ✅ Task folder referenced in PR description' : '- ❌ Missing task folder reference (expected: `tasks/<slug>-YYYYMMDD-HHMM>`)',
              '- [ ] `pnpm lint`',
              '- [ ] `pnpm typecheck`',
              '- [ ] `pnpm test:ci`',
              '- [ ] Update `tasks/<task>/verification.md` with evidence',
              '',
              'If this is a UI change: include screenshots and DevTools QA artifacts.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').includes('## PR Readiness Checklist'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message,
            });

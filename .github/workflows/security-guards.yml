name: Security guards

# Runs on every pull request and every push to main without path filters: the
# release gate requires a successful run of this workflow on the tested
# revision, so a skipped run would block merges (fail closed) rather than pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-role-routes:
    name: Service-role route authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check service-role route guards
        run: pnpm run security:guard:service-role

      - name: Run security regression pack
        run: pnpm run security:regression

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high

      # gitleaks and trufflehog are not provisioned on the hosted runner yet, so the
      # scan runs the repository's built-in scanner only. The variable is required by
      # scripts/security/secret-scan.ts for that mode and is asserted by
      # `pnpm ci:contracts:validate`; remove it once SHA-pinned installs of both
      # scanners precede this step (docs/ci/governance.md, "Contract validation").
      - name: Secret scan
        env:
          SECRET_SCAN_ALLOW_BUILT_IN_ONLY: 'true'
        run: pnpm secret:scan

      - name: Validate trusted CI contracts
        run: pnpm ci:contracts:validate

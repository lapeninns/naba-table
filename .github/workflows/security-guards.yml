name: Security guards

on:
  pull_request:
    paths:
      - '.github/workflows/security-guards.yml'
      - 'config/env.schema.ts'
      - 'docs/security/**'
      - 'lib/api/**'
      - 'lib/auth/**'
      - 'lib/export/**'
      - 'lib/security/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/security/**'
      - 'server/**'
      - 'src/app/api/**'
      - 'src/app/**/route.ts'
      - 'src/app/**/middleware.ts'
      - 'supabase/migrations/**'
      - 'tests/lib/security/**'
      - 'tests/server/**'
      - 'tests/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-role-routes:
    name: Service-role route authorization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check service-role route guards
        run: pnpm run security:guard:service-role

      - name: Run security regression pack
        run: pnpm run security:regression

name: E2E (Playwright)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for staging/preview (e.g., https://staging.example.com)'
        required: true
        type: string

env:
  HUSKY: 0

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E (all projects)
        env:
          BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL }}
          E2E_GUEST_SESSION_TOKEN: ${{ secrets.E2E_TEST_TOKEN }}
          E2E_TEST_GUEST_EMAIL: ${{ secrets.E2E_TEST_GUEST_EMAIL }}
          E2E_TEST_GUEST_NAME: ${{ secrets.E2E_TEST_GUEST_NAME }}
          E2E_TEST_RESTAURANT_SLUG: ${{ secrets.E2E_TEST_RESTAURANT_SLUG }}
          E2E_OPS_BASE_URL: ${{ secrets.E2E_OPS_BASE_URL }}
          E2E_OPS_EMAIL: ${{ secrets.E2E_OPS_EMAIL }}
          E2E_OPS_PASSWORD: ${{ secrets.E2E_OPS_PASSWORD }}
        run: pnpm exec playwright test tests/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

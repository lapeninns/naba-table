name: Test suite

# Scheduled for removal after Phase 4 evidence: the local CI profile evidences
# this suite and the release gate republishes the "Full Vitest suite" check from it.
# Kept until the transition evidence window closes; do not add new steps here.

# Run the Vitest suite on pull requests and pushes to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    name: Full Vitest suite
    runs-on: [self-hosted, nabatable]
    env:
      # Sanitized offline env only. Tests must never receive real credentials;
      # tests/setup.ts fallbacks align with these values.
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Vitest suite
        run: pnpm test

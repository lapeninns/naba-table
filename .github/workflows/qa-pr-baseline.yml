name: QA PR baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: PR baseline
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      QA_TARGET_ENV: ci-ephemeral
      RESEND_API_KEY: test-resend-api-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MS-foundation-playwright-ci-gate: the baseline selector can pick
      # Playwright smoke on UI-touching PRs; without a browser binary that
      # selection fails and is misclassified as a product failure. Chromium
      # installs unconditionally (~30s) — conditional install adds fragile
      # complexity.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run PR baseline
        run: pnpm run qa:pr-baseline -- --base-ref origin/main --head-ref HEAD

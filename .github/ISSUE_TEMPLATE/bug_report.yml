name: Bug report
description: Report a reproducible Nabatable defect.
title: '[Bug]: '
labels: ['type:bug', 'status:triage']
body:
  - type: markdown
    attributes:
      value: Do not include customer PII, credentials, access tokens, or production payloads.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is broken, who is affected, and how severe is it?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give deterministic steps, route, environment, and sanitized inputs.
      placeholder: "1. Open ...\n2. Perform ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs, screenshots, trace IDs, or failing test output without secrets or PII.
  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - Web / API
        - Booking short links Worker
        - Email queue gateway Worker
        - SMS summary gateway Worker
        - Unknown / cross-application
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, customer PII, and production payloads.
          required: true

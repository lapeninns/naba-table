name: Feature request
description: Propose a measurable product or platform improvement.
title: '[Feature]: '
labels: ['type:feature', 'status:triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: State observable acceptance criteria and how impact will be measured.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Include tenancy, capacity, privacy, provider, rollout, or migration concerns.
    validations:
      required: true
  - type: dropdown
    id: application
    attributes:
      label: Primary application
      options:
        - Web / API
        - Booking short links Worker
        - Email queue gateway Worker
        - SMS summary gateway Worker
        - Cross-application
    validations:
      required: true

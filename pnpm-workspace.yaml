packages:
  - .
  - cloudflare/*

# Hold newly published packages for 24 hours so compromised releases have time
# to be detected and removed before normal dependency resolution can select them.
minimumReleaseAge: 1440

overrides:
  '@isaacs/brace-expansion': ^5.0.1
  '@opentelemetry/core': ^2.8.0
  '@protobufjs/utf8': ^1.1.1
  'brace-expansion@<2': ^1.1.18
  'brace-expansion@>=2 <3': ^2.1.4
  'brace-expansion@>=3': ^5.0.9
  browserslist: ^4.28.8
  dompurify: ^3.4.14
  fast-uri: ^3.1.7
  fflate: ^0.4.9
  flatted: ^3.4.2
  js-yaml: ^4.3.1
  lodash-es: ^4.18.0
  'minimatch@<4': ^3.1.4
  'minimatch@>=9 <10': ^9.0.7
  'minimatch@>=10': ^10.2.3
  nanoid: ^3.3.18
  picomatch: ^4.0.4
  postcss: ^8.5.28
  prismjs: ^1.30.0
  protobufjs: ^7.6.6
  sharp: ^0.35.4
  tar: ^7.5.2
  undici: ^7.29.0
  uuid: ^11.1.1
  ws: ^8.21.3

onlyBuiltDependencies:
  - esbuild
  - sharp

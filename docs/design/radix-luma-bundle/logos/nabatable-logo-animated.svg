    <circle cx="230" cy="200" r="2" fill="#93C5FD">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.5;0" dur="1s" begin="3.5s" repeatCount="indefinite" additive="sum"/>
    </circle>
    <circle cx="282" cy="200" r="2" fill="#60A5FA">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="3.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.5;0" dur="1s" begin="3.7s" repeatCount="indefinite" additive="sum"/>
    </circle>
    <circle cx="230" cy="248" r="2" fill="#1D4ED8">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="3.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.5;0" dur="1s" begin="3.9s" repeatCount="indefinite" additive="sum"/>
    </circle>
    <circle cx="282" cy="248" r="2" fill="#93C5FD">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="4.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.5;0" dur="1s" begin="4.1s" repeatCount="indefinite" additive="sum"/>
    </circle>
  </g>
  
  <g transform="translate(256, 224)" filter="url(#badgeGlow)" opacity="0">
    <animateTransform attributeName="transform" type="scale" values="0;1.3;0.9;1.1;1" dur="0.6s" begin="1.6s" additive="sum" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze"/>
    <circle r="28" fill="#93C5FD" opacity="0.3">
      <animate attributeName="r" values="28;32;28" dur="2s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="url(#badgeGradient)">
      <animate attributeName="r" values="26;27;26" dur="2s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="24" fill="#1E40AF">
      <animate attributeName="r" values="24;25;24" dur="2s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-4" cy="-4" r="18" fill="white" opacity="0.15"/>
    <path d="M -9 -1 L -4 5 L 11 -10" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" stroke-dasharray="30" stroke-dashoffset="30">
      <animate attributeName="stroke-dashoffset" values="30;0;0;0;0;0;30" dur="4s" begin="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M -9 -1 L -4 5 L 11 -10" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="30" stroke-dashoffset="30">
      <animate attributeName="stroke-dashoffset" values="30;0;0;0;0;0;30" dur="4s" begin="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <text x="256" y="268" font-family="'Georgia', serif" font-size="12" font-weight="300" font-style="italic" fill="#CBD5E1" text-anchor="middle" opacity="0.2">n</text>
</svg>

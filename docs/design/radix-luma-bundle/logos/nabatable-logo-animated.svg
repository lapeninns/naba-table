<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandPinGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="badgeGradient" x1="230" y1="200" x2="282" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="200" y1="199" x2="312" y2="249" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <radialGradient id="plateGradient" cx="256" cy="224" r="62">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F9FAFB" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </radialGradient>
    <filter id="pinDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="plateSoftShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feFlood flood-color="#1E3A8A" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="plateInnerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="2" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feFlood flood-color="#1E40AF" flood-opacity="0.3" />
      <feComposite in2="offsetblur" operator="in" />
      <feComposite in2="SourceAlpha" operator="in" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode />
      </feMerge>
    </filter>
    <filter id="badgeGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#1E40AF" flood-opacity="0.5">
        <animate attributeName="flood-opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
      </feFlood>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,-50;0,10;0,-5;0,0" dur="0.6s" fill="freeze"/>
    <path d="M256 32C150 32 64 118 64 224c0 85 60 180 176 252a32 32 0 0 0 32 0c116-72 176-167 176-252C448 118 362 32 256 32z" fill="url(#brandPinGradient)" filter="url(#pinDropShadow)" />
    <path d="M256 48C164 48 88 124 88 216c0 78 54 164 160 230a24 24 0 0 0 16 0c106-66 160-152 160-230C424 124 348 48 256 48z" fill="none" stroke="url(#brandPinGradient)" stroke-width="2" opacity="0.3" />
  </g>
  
  <circle cx="256" cy="224" r="112" fill="white" opacity="0" filter="url(#plateSoftShadow)">
    <animate attributeName="opacity" values="0;0.3" dur="0.4s" begin="0.6s" fill="freeze"/>
  </circle>
  <circle cx="256" cy="224" r="110" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
  </circle>
  
  <g opacity="0" transform="translate(256, 224)">
    <animateTransform attributeName="transform" type="scale" values="0;1.1;1" dur="0.5s" begin="0.8s" additive="sum" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <circle cx="0" cy="0" r="64" fill="url(#plateGradient)" filter="url(#plateSoftShadow)"/>
    <circle cx="0" cy="0" r="63" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="52" fill="#FEFEFE"/>
    <circle cx="0" cy="0" r="51" fill="none" stroke="#F3F4F6" stroke-width="2" filter="url(#plateInnerShadow)"/>
    <circle cx="0" cy="0" r="49" fill="none" stroke="#E5E7EB" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    <path d="M 240 200 Q 235 180 240 160" stroke="#CBD5E1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4">
      <animate attributeName="d" values="M 240 200 Q 235 180 240 160;M 240 200 Q 245 180 240 160;M 240 200 Q 235 180 240 160" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.7;0.1;0.4" dur="3s" begin="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 256 195 Q 251 175 256 155" stroke="#CBD5E1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5">
      <animate attributeName="d" values="M 256 195 Q 251 175 256 155;M 256 195 Q 261 175 256 155;M 256 195 Q 251 175 256 155" dur="3.2s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.1;0.5" dur="3.2s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 272 200 Q 277 180 272 160" stroke="#CBD5E1" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3">
      <animate attributeName="d" values="M 272 200 Q 277 180 272 160;M 272 200 Q 267 180 272 160;M 272 200 Q 277 180 272 160" dur="2.8s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.1;0.3" dur="2.8s" begin="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(198, 224)" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="140,224;198,224" dur="0.4s" begin="1.1s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="-2" y="-30" width="4" height="60" rx="2" fill="url(#silverGradient)"/>
    <rect x="-6" y="-30" width="2.5" height="18" rx="1" fill="url(#silverGradient)"/>
    <rect x="-2" y="-30" width="2.5" height="20" rx="1" fill="url(#silverGradient)"/>
    <rect x="2" y="-30" width="2.5" height="18" rx="1" fill="url(#silverGradient)"/>
    <line x1="0" y1="-25" x2="0" y2="20" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="2.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <g transform="translate(314, 224)" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="372,224;314,224" dur="0.4s" begin="1.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <rect x="-2" y="5" width="4" height="25" rx="2" fill="url(#silverGradient)"/>
    <path d="M -2 5 L -2 -25 Q -2 -30 0 -32 Q 2 -30 2 -25 L 2 5" fill="#CBD5E1"/>
    <path d="M -1.5 5 L -1.5 -26 Q -1.5 -30 0 -31 Q 1.5 -30 1.5 -26 L 1.5 5" fill="url(#silverGradient)"/>
    <line x1="-2" y1="-28" x2="0" y2="-32" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="-32" x2="2" y2="-28" stroke="#94A3B8" stroke-width="0.5"/>
    <line x1="0" y1="-28" x2="0" y2="25" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" begin="2.6s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <g transform="translate(256, 170)" opacity="0">

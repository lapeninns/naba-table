repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: Secret scanning (gitleaks + trufflehog)
        entry: scripts/pre-commit/secret-scan.sh
        language: script
        pass_filenames: false
        stages: [commit, push]

      - id: check-file-size
        name: Check file sizes
        entry: scripts/pre-commit/check-file-size.sh
        language: script
        pass_filenames: false
        stages: [commit]
